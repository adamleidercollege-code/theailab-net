[build]
  publish = "."
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

[[redirects]]
  from = "/admin"
  to = "/core/admin.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
