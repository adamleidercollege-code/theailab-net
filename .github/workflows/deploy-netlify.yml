name: Deploy site to Netlify

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: netlify-production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run site test suite
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: Run pytest
        run: pytest tests/ -v

  deploy:
    name: Deploy production site
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install function dependencies
        run: npm install --no-audit --no-fund

      - name: Install Netlify CLI
        run: npm install --no-audit --no-fund --global netlify-cli@21

      - name: Deploy site to Netlify (static files, functions, edge functions)
        run: |
          netlify deploy --prod --no-build --message "GitHub Actions deploy ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
