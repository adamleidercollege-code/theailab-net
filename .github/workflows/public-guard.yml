name: Public guard

# This workflow is allowlisted (.sync/public.allow) and is synced verbatim
# A -> B. It is meaningful only in repo B (public site: jon-chun/theailab-net);
# in repo A (jon-chun/theailab-net-dev) the job condition below makes every
# run a no-op so the file can safely live in both repos.

on:
  push:
  pull_request:

jobs:
  guard:
    if: github.repository == 'jon-chun/theailab-net'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and run gitleaks
        uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run public_guard.py
        run: |
          python3 .github/sync/public_guard.py .

      - name: Assert no private-tree paths are tracked
        run: |
          if git ls-files | grep -E '^weeks/.*\.md$|^docs/|^notes/|^dev'; then
            echo "::error::Private-tree paths are tracked in this repo (weeks/*.md, docs/, notes/, dev*). This must never happen in the public repo." >&2
            exit 1
          fi
          echo "OK: no private-tree paths tracked."
